name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Prepare release slot before the build matrix starts ──────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly" >> $GITHUB_OUTPUT
          fi

      - name: Create / refresh nightly release
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly \
            --title "NekoDrift Nightly" \
            --notes "Latest build from \`main\` — commit ${{ github.sha }}" \
            --prerelease \
            --repo "$GH_REPO"

  # ── Build matrix ──────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            label: macOS
            artifacts: "dist-electron/*.dmg dist-electron/*.zip"
          - os: windows-latest
            platform: win
            label: Windows
            artifacts: "dist-electron/*.exe"
          - os: ubuntu-22.04
            platform: linux
            label: Linux
            artifacts: "dist-electron/*.AppImage dist-electron/*.deb"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libpng-dev \
            libxcb-xfixes0-dev libxcb-image0-dev \
            rpm fakeroot dpkg \
            libglib2.0-dev libgtk-3-dev \
            librsvg2-bin imagemagick

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install librsvg imagemagick

      - name: Generate icons (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          rsvg-convert -w 512 -h 512 assets/icon.svg -o assets/icon.png
          rsvg-convert -w 32  -h 32  assets/icon.svg -o assets/tray-icon.png
          rsvg-convert -w 22  -h 22  assets/icon.svg -o assets/tray-icon-mac.png

      - name: Generate icon.icns (macOS)
        if: matrix.os == 'macos-latest'
        run: bash scripts/generate-icns.sh

      - name: Generate icon.ico (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          for size in 16 32 48 256; do
            rsvg-convert -w $size -h $size assets/icon.svg -o /tmp/icon-${size}.png
          done
          convert /tmp/icon-16.png /tmp/icon-32.png /tmp/icon-48.png /tmp/icon-256.png assets/icon.ico || true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          files=$(ls ${{ matrix.artifacts }} 2>/dev/null | tr '\n' ' ')
          if [ -n "$files" ]; then
            gh release upload "$TAG" $files --clobber --repo "$GH_REPO"
          fi
