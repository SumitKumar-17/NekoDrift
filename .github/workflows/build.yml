name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*.*.*']
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

permissions:
  contents: write

# ── Step 1: Create/refresh the nightly release slot ─────────────
# Runs only on branch pushes (not tags). Tagged releases are
# created by electron-builder --publish always in the build job.
jobs:
  prepare:
    if: "github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version + short SHA
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA="${{ github.sha }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=${SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Create / refresh nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --repo ${{ github.repository }} 2>/dev/null || true
          gh release create nightly \
            --repo ${{ github.repository }} \
            --title "NekoDrift v${{ steps.meta.outputs.version }} — Nightly" \
            --notes "$(cat <<'NOTES'
          ## Nightly Build

          Automatically built from `master`.

          | | |
          |---|---|
          | **Version** | ${{ steps.meta.outputs.version }} |
          | **Commit** | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Triggered by** | ${{ github.actor }} |

          > This release is overwritten on every push to `master`.
          > For a stable release, use a versioned tag.

          ### Download
          | Platform | File |
          |---|---|
          | macOS (Apple Silicon + Intel) | `.dmg` |
          | Windows | `.exe` (installer) |
          | Linux | `.AppImage` or `.deb` |
          NOTES
          )" \
            --prerelease

  # ── Step 2: Build on every matrix ─────────────────────────────
  build:
    # For branch pushes, wait for prepare to finish first.
    # For tags and PRs, run independently (no release slot needed).
    needs: [prepare]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            label: macOS
          - os: windows-latest
            platform: win
            label: Windows
          - os: ubuntu-22.04
            platform: linux
            label: Linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Platform deps ────────────────────────────────────────
      - name: Linux — system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libx11-dev libxtst-dev libpng-dev \
            libxcb-xfixes0-dev libxcb-image0-dev \
            rpm fakeroot dpkg \
            libglib2.0-dev libgtk-3-dev \
            librsvg2-bin imagemagick

      - name: macOS — brew tools
        if: matrix.os == 'macos-latest'
        run: brew install librsvg imagemagick

      # ── Icon generation ──────────────────────────────────────
      - name: Generate PNG icons (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          rsvg-convert -w 512 -h 512 assets/icon.svg -o assets/icon.png
          rsvg-convert -w 32  -h 32  assets/icon.svg -o assets/tray-icon.png
          rsvg-convert -w 22  -h 22  assets/icon.svg -o assets/tray-icon-mac.png

      - name: Generate icon.icns (macOS)
        if: matrix.os == 'macos-latest'
        run: bash scripts/generate-icns.sh

      - name: Generate icon.ico (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          for size in 16 32 48 256; do
            rsvg-convert -w $size -h $size assets/icon.svg -o /tmp/icon-${size}.png
          done
          convert /tmp/icon-16.png /tmp/icon-32.png /tmp/icon-48.png /tmp/icon-256.png assets/icon.ico || true

      # ── Build ────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      # ── Package & publish ────────────────────────────────────

      # Tagged release: electron-builder creates the GitHub Release and
      # uploads artifacts directly — one step, proper release metadata.
      - name: Package + publish (tag → versioned release)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder build --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Non-tag push: package locally, then upload to the nightly slot.
      # We do NOT use --publish here because the release was already
      # created by the prepare job with custom notes.
      - name: Package (nightly)
        if: "github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')"
        run: npm run package:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Upload artifacts to the nightly release.
      # Key fixes vs previous version:
      #   - shopt -s nullglob: glob expands to empty array (not literal string) when no match
      #   - array syntax "${files[@]}": each element quoted, handles spaces in .exe names
      - name: Upload artifacts → nightly
        if: "github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
          )
          echo "Artifacts found: ${#files[@]}"
          for f in "${files[@]}"; do echo "  → $f"; done

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No artifacts — listing dist-electron/:"
            ls -la dist-electron/ || true
            exit 1
          fi

          gh release upload nightly "${files[@]}" \
            --clobber \
            --repo ${{ github.repository }}

      # PR: just upload build artifacts for review — no release.
      - name: Upload artifacts → PR check
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nekodrift-${{ matrix.label }}-pr${{ github.event.pull_request.number }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: ignore
          retention-days: 3
