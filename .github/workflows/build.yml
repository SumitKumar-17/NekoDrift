name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            label: macOS
          - os: windows-latest
            platform: win
            label: Windows
          - os: ubuntu-22.04
            platform: linux
            label: Linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libpng-dev \
            libxcb-xfixes0-dev libxcb-image0-dev \
            rpm fakeroot dpkg \
            libglib2.0-dev libgtk-3-dev

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (no publish)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npm run package:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & Publish (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder build --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts (non-release)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: nekodrift-${{ matrix.label }}-${{ github.sha }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: ignore
          retention-days: 7
