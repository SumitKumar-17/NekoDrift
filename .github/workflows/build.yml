name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Nightly slot (main-branch pushes only, not tags) ──────────────────────
  prepare-nightly:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create / refresh nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --repo ${{ github.repository }} 2>/dev/null || true
          gh release create nightly \
            --repo ${{ github.repository }} \
            --title "NekoDrift — Nightly (v${{ steps.meta.outputs.version }})" \
            --notes "## Nightly Build

Automatically built from the \`main\` branch — updated on every push.

| | |
|---|---|
| **Version** | v${{ steps.meta.outputs.version }} |
| **Commit** | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |

### Downloads
| Platform | Installer | Portable |
|---|---|---|
| 🍎 macOS (Universal) | \`.dmg\` | \`.zip\` |
| 🪟 Windows | \`-setup.exe\` | \`-portable.exe\` |
| 🐧 Linux | \`.AppImage\` | \`.deb\` / \`.rpm\` |

> Nightly builds may be unstable. For stable releases see the [Releases page](../../releases)." \
            --prerelease

  # ── Build matrix ──────────────────────────────────────────────────────────
  build:
    needs: [prepare-nightly]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            label: macOS
          - os: windows-latest
            platform: win
            label: Windows
          - os: ubuntu-22.04
            platform: linux
            label: Linux

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      # ── Node + pnpm ──────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      # ── Platform system libraries ────────────────────────────────────────
      - name: Linux — system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libx11-dev libxtst-dev libpng-dev \
            rpm fakeroot dpkg \
            libglib2.0-dev libgtk-3-dev \
            librsvg2-bin imagemagick

      - name: macOS — brew tools
        if: matrix.os == 'macos-latest'
        run: brew install librsvg imagemagick

      # ── Icons ────────────────────────────────────────────────────────────
      - name: Generate PNG icons (Linux + macOS)
        if: matrix.os != 'windows-latest'
        run: |
          rsvg-convert -w 512 -h 512 assets/icon.svg -o apps/desktop/assets/app-icon.png
          rsvg-convert -w 22  -h 22  assets/icon.svg -o apps/desktop/assets/tray-icon.png

      - name: Generate app-icon.ico (Linux step, committed into repo for Windows)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          for size in 16 24 32 48 64 128 256; do
            rsvg-convert -w $size -h $size assets/icon.svg -o /tmp/icon-${size}.png
          done
          magick /tmp/icon-16.png /tmp/icon-24.png /tmp/icon-32.png \
                 /tmp/icon-48.png /tmp/icon-64.png /tmp/icon-128.png /tmp/icon-256.png \
                 apps/desktop/assets/app-icon.ico

      - name: Generate app-icon.icns (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p /tmp/nekodrift.iconset
          for size in 16 32 64 128 256 512; do
            rsvg-convert -w $size         -h $size         assets/icon.svg \
              -o /tmp/nekodrift.iconset/icon_${size}x${size}.png
            rsvg-convert -w $((size * 2)) -h $((size * 2)) assets/icon.svg \
              -o "/tmp/nekodrift.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns /tmp/nekodrift.iconset \
            -o apps/desktop/assets/app-icon.icns

      # Windows: use the pre-committed app-icon.ico from the repo
      - name: Copy committed .ico for Windows build
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "Using committed apps/desktop/assets/app-icon.ico"

      # ── Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install

      # ── Build workspace packages then desktop ────────────────────────────
      - name: Build workspace dependencies
        run: pnpm --filter @neko-drift/desktop^... build

      - name: Build desktop (main + renderer)
        run: pnpm --filter @neko-drift/desktop build

      # ── Package + publish ────────────────────────────────────────────────

      # Tagged release → proper versioned GitHub Release (not pre-release)
      - name: Package + publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        run: |
          node scripts/clean-package-output.cjs
          npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Main-branch push → package then upload to nightly slot
      - name: Package (nightly)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        run: |
          node scripts/clean-package-output.cjs
          npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts → nightly release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.rpm
            apps/desktop/dist-electron/*.tar.gz
          )
          echo "Artifacts found: ${#files[@]}"
          for f in "${files[@]}"; do echo "  → $f"; done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No artifacts — listing dist-electron/:"
            ls -la apps/desktop/dist-electron/ || true
            exit 1
          fi
          gh release upload nightly "${files[@]}" \
            --clobber \
            --repo ${{ github.repository }}

      # PR → upload as workflow artifact (no release)
      - name: Upload artifacts → PR check
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nekodrift-${{ matrix.label }}-pr${{ github.event.pull_request.number }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.rpm
          if-no-files-found: ignore
          retention-days: 7
