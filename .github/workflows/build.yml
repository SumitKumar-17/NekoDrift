name: Auto Version & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Auto version bump — runs on every main push (skips release commits) ──
  version:
    if: |
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use GITHUB_TOKEN — pushes made with this token don't re-trigger workflows
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type and compute new version
        id: bump
        run: |
          set -e

          # If the HEAD commit is already tagged, reuse that tag (no new bump)
          EXISTING_TAG=$(git tag --points-at HEAD 2>/dev/null | grep '^v' | sort -V | tail -1)
          if [ -n "$EXISTING_TAG" ]; then
            VERSION="${EXISTING_TAG#v}"
            echo "HEAD already tagged as $EXISTING_TAG — using existing version"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(node -p "require('./apps/desktop/package.json').version")

          # Collect commits since the last semver tag
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s%n%b" 2>/dev/null)
          else
            COMMITS=$(git log --pretty=format:"%s%n%b" 2>/dev/null)
          fi

          # Determine bump type using Conventional Commits conventions:
          #   feat:     → minor bump
          #   BREAKING CHANGE or ! suffix → major bump
          #   anything else → patch bump
          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "^feat(\([^)]+\))?[!]?:"; then
            BUMP="minor"
          fi
          if echo "$COMMITS" | grep -qiE "(^|\n)BREAKING CHANGE" || \
             echo "$COMMITS" | grep -qiE "^[a-z]+(\([^)]+\))!:"; then
            BUMP="major"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          if   [ "$BUMP" = "major" ]; then NEW="$((MAJOR+1)).0.0"
          elif [ "$BUMP" = "minor" ]; then NEW="${MAJOR}.$((MINOR+1)).0"
          else                             NEW="${MAJOR}.${MINOR}.$((PATCH+1))"
          fi

          # Update apps/desktop/package.json
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = '$NEW';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "Bumped $CURRENT → $NEW  (${BUMP} bump, last tag: ${LAST_TAG:-none})"
          echo "version=$NEW"  >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"     >> "$GITHUB_OUTPUT"
          echo "already_tagged=false" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        if: steps.bump.outputs.already_tagged != 'true'
        run: |
          git add apps/desktop/package.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.version }}"

  # ── Build matrix — 3 platforms in parallel ────────────────────────────────
  build:
    # For main push: run only after a successful version job.
    # For PRs: run directly (version job is skipped on PRs).
    needs: [version]
    if: |
      always() && (
        (github.event_name == 'push'         && needs.version.result == 'success') ||
        (github.event_name == 'pull_request')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            label: macOS
          - os: windows-latest
            platform: win
            label: Windows
          - os: ubuntu-22.04
            platform: linux
            label: Linux

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.label }}

    steps:
      # Check out the newly-created release tag (or PR head)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && needs.version.outputs.tag || github.sha }}

      # ── Node + pnpm ──────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      # ── Platform system libraries ────────────────────────────────────────
      - name: Linux — system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libx11-dev libxtst-dev libpng-dev \
            rpm fakeroot dpkg \
            libglib2.0-dev libgtk-3-dev \
            librsvg2-bin imagemagick

      - name: macOS — brew tools
        if: matrix.os == 'macos-latest'
        run: brew install librsvg imagemagick

      # ── Icons ────────────────────────────────────────────────────────────
      - name: Generate PNG icons (Linux + macOS)
        if: matrix.os != 'windows-latest'
        run: |
          rsvg-convert -w 512 -h 512 assets/icon.svg -o apps/desktop/assets/app-icon.png
          rsvg-convert -w 22  -h 22  assets/icon.svg -o apps/desktop/assets/tray-icon.png

      - name: Generate app-icon.ico (Linux — also commits baseline for Windows)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          for size in 16 24 32 48 64 128 256; do
            rsvg-convert -w $size -h $size assets/icon.svg -o /tmp/icon-${size}.png
          done
          magick /tmp/icon-16.png /tmp/icon-24.png /tmp/icon-32.png \
                 /tmp/icon-48.png /tmp/icon-64.png /tmp/icon-128.png /tmp/icon-256.png \
                 apps/desktop/assets/app-icon.ico

      - name: Generate app-icon.icns (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p /tmp/nekodrift.iconset
          for size in 16 32 64 128 256 512; do
            rsvg-convert -w $size         -h $size         assets/icon.svg \
              -o /tmp/nekodrift.iconset/icon_${size}x${size}.png
            rsvg-convert -w $((size * 2)) -h $((size * 2)) assets/icon.svg \
              -o "/tmp/nekodrift.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns /tmp/nekodrift.iconset -o apps/desktop/assets/app-icon.icns

      - name: Copy committed .ico for Windows build
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "Using committed apps/desktop/assets/app-icon.ico"

      # ── Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install

      # ── Build workspace packages then desktop ────────────────────────────
      - name: Build workspace dependencies
        run: pnpm --filter @neko-drift/desktop^... build

      - name: Build desktop (main + renderer)
        run: pnpm --filter @neko-drift/desktop build

      # ── Package + publish ────────────────────────────────────────────────

      # Main-branch push → package and publish to a versioned GitHub Release
      - name: Package + publish versioned release
        if: github.event_name == 'push'
        working-directory: apps/desktop
        run: |
          node scripts/clean-package-output.cjs
          npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # PR → upload as workflow artifact for inspection (no release created)
      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        working-directory: apps/desktop
        run: |
          node scripts/clean-package-output.cjs
          npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts → PR check
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nekodrift-${{ matrix.label }}-pr${{ github.event.pull_request.number }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.rpm
          if-no-files-found: ignore
          retention-days: 7
