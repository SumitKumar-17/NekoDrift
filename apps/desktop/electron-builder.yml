appId: dev.nekodrift.app
productName: NekoDrift
executableName: nekodrift
copyright: Copyright © 2026 NekoDrift

directories:
  output: dist-electron

artifactName: NekoDrift-${version}-${os}-${arch}.${ext}

# GitHub Releases publish config (used when --publish always is passed)
publish:
  provider: github
  releaseType: release

files:
  - dist/**
  - control-center-preload.cjs
  - pet-preload.cjs
  - plugin-sdk-preload.cjs
  - plugin-command-form-preload.cjs
  - assets/**
  - package.json

extraResources:
  - from: ../../plugins/official
    to: plugins/official

asar: true
asarUnpack:
  - node_modules/**
npmRebuild: false

toolsets:
  appimage: 1.0.3

mac:
  icon: assets/app-icon.icns
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  # Ad-hoc sign macOS bundles when a Developer ID certificate is unavailable.
  # Leaving the app bundle fully unsigned can produce Gatekeeper's misleading
  # "damaged and can't be opened" dialog on Apple Silicon releases.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  icon: assets/app-icon.ico
  target:
    - nsis
    - portable
  verifyUpdateCodeSignature: false

nsis:
  artifactName: NekoDrift-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

portable:
  artifactName: NekoDrift-${version}-win-${arch}-portable.${ext}

linux:
  icon: assets/app-icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  category: Utility
  maintainer: NekoDrift
