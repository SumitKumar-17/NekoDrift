<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#fdf6f0"/>
  <!-- Cat body -->
  <ellipse cx="256" cy="340" rx="130" ry="110" fill="#e8894a"/>
  <!-- Cat belly -->
  <ellipse cx="256" cy="350" rx="80" ry="70" fill="#f9c89b"/>
  <!-- Cat head -->
  <ellipse cx="256" cy="220" rx="110" ry="100" fill="#e8894a"/>
  <!-- Left ear -->
  <polygon points="140,140 170,80 210,140" fill="#e8894a"/>
  <polygon points="152,138 170,100 200,138" fill="#f4a7b9"/>
  <!-- Right ear -->
  <polygon points="302,140 342,80 372,140" fill="#e8894a"/>
  <polygon points="312,138 342,100 360,138" fill="#f4a7b9"/>
  <!-- Eyes -->
  <ellipse cx="220" cy="215" rx="22" ry="24" fill="#2d1b0e"/>
  <ellipse cx="292" cy="215" rx="22" ry="24" fill="#2d1b0e"/>
  <ellipse cx="215" cy="210" rx="7" ry="7" fill="white"/>
  <ellipse cx="287" cy="210" rx="7" ry="7" fill="white"/>
  <!-- Nose -->
  <ellipse cx="256" cy="250" rx="12" ry="8" fill="#f4a7b9"/>
  <!-- Mouth -->
  <path d="M244,258 Q256,270 268,258" stroke="#2d1b0e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="150" y1="245" x2="230" y2="250" stroke="#c96a2a" stroke-width="2.5" opacity="0.6"/>
  <line x1="150" y1="260" x2="230" y2="252" stroke="#c96a2a" stroke-width="2.5" opacity="0.6"/>
  <line x1="362" y1="245" x2="282" y2="250" stroke="#c96a2a" stroke-width="2.5" opacity="0.6"/>
  <line x1="362" y1="260" x2="282" y2="252" stroke="#c96a2a" stroke-width="2.5" opacity="0.6"/>
  <!-- Tail -->
  <path d="M386,380 Q440,320 420,260 Q415,240 400,250" stroke="#e8894a" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="200" cy="440" rx="38" ry="28" fill="#e8894a"/>
  <ellipse cx="312" cy="440" rx="38" ry="28" fill="#e8894a"/>
</svg>