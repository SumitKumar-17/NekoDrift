<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softshadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect width="512" height="512" rx="112" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.35"/>

  <!-- ── Pixel cat body (centered, sitting) ── -->
  <!-- Body pixel grid: each "pixel" = 24×24 px, origin at (160, 180) -->

  <!-- Cat ears (left) -->
  <rect x="152" y="96"  width="72" height="24" fill="url(#body)" filter="url(#softshadow)"/>
  <rect x="152" y="120" width="48" height="24" fill="url(#body)"/>
  <rect x="152" y="144" width="24" height="24" fill="url(#body)"/>
  <!-- Ear inner (left) -->
  <rect x="168" y="108" width="40" height="18" fill="#f472b6" opacity="0.7"/>

  <!-- Cat ears (right) -->
  <rect x="288" y="96"  width="72" height="24" fill="url(#body)" filter="url(#softshadow)"/>
  <rect x="312" y="120" width="48" height="24" fill="url(#body)"/>
  <rect x="336" y="144" width="24" height="24" fill="url(#body)"/>
  <!-- Ear inner (right) -->
  <rect x="304" y="108" width="40" height="18" fill="#f472b6" opacity="0.7"/>

  <!-- Head -->
  <rect x="152" y="168" width="208" height="168" rx="8" fill="url(#body)" filter="url(#softshadow)"/>

  <!-- Eyes -->
  <!-- Left eye outer -->
  <rect x="184" y="210" width="48" height="40" rx="4" fill="#0f172a"/>
  <!-- Left eye iris -->
  <rect x="192" y="218" width="32" height="28" rx="2" fill="#38bdf8"/>
  <!-- Left eye pupil -->
  <rect x="204" y="220" width="12" height="24" rx="2" fill="#0f172a"/>
  <!-- Left eye highlight -->
  <rect x="196" y="220" width="8" height="8" fill="#fff" opacity="0.9"/>

  <!-- Right eye outer -->
  <rect x="280" y="210" width="48" height="40" rx="4" fill="#0f172a"/>
  <!-- Right eye iris -->
  <rect x="288" y="218" width="32" height="28" rx="2" fill="#38bdf8"/>
  <!-- Right eye pupil -->
  <rect x="296" y="220" width="12" height="24" rx="2" fill="#0f172a"/>
  <!-- Right eye highlight -->
  <rect x="292" y="220" width="8" height="8" fill="#fff" opacity="0.9"/>

  <!-- Nose -->
  <rect x="244" y="268" width="24" height="16" rx="4" fill="#f472b6"/>
  <!-- Mouth -->
  <rect x="232" y="284" width="12" height="8" fill="#64748b"/>
  <rect x="268" y="284" width="12" height="8" fill="#64748b"/>

  <!-- Whiskers left -->
  <rect x="96"  y="270" width="72" height="4" rx="2" fill="#94a3b8" opacity="0.8"/>
  <rect x="88"  y="288" width="72" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
  <!-- Whiskers right -->
  <rect x="344" y="270" width="72" height="4" rx="2" fill="#94a3b8" opacity="0.8"/>
  <rect x="352" y="288" width="72" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>

  <!-- Body/torso -->
  <rect x="176" y="336" width="160" height="88" rx="8" fill="url(#body)"/>
  <!-- Paws -->
  <rect x="152" y="400" width="72" height="40" rx="12" fill="url(#body)"/>
  <rect x="288" y="400" width="72" height="40" rx="12" fill="url(#body)"/>
  <!-- Paw pads -->
  <rect x="164" y="416" width="20" height="16" rx="4" fill="#f9a8d4" opacity="0.7"/>
  <rect x="300" y="416" width="20" height="16" rx="4" fill="#f9a8d4" opacity="0.7"/>

  <!-- Tail -->
  <rect x="352" y="352" width="28" height="88" rx="14" fill="url(#body)"/>
  <rect x="352" y="428" width="48" height="28" rx="14" fill="url(#body)"/>

  <!-- Collar -->
  <rect x="176" y="328" width="160" height="20" rx="4" fill="#6366f1"/>
  <!-- Collar bell -->
  <rect x="244" y="332" width="24" height="20" rx="10" fill="#fbbf24"/>
  <rect x="250" y="340" width="12" height="8" rx="4" fill="#92400e"/>

  <!-- Forehead star/mark -->
  <polygon points="256,175 262,193 280,193 266,204 272,222 256,212 240,222 246,204 232,193 250,193" fill="#6366f1" opacity="0.8"/>
</svg>
