<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
  <title>NekoDrift — Sprite Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1e1e2e;
      --surface: #2a2a3e;
      --border: #3a3a5c;
      --accent: #f4a7b9;
      --text: #e0e0f0;
      --muted: #888aaa;
      --radius: 12px;
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    header span { font-size: 18px; }
    .sprite-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sprite-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.15s;
    }
    .sprite-card:hover { border-color: var(--accent); }
    .sprite-emoji { font-size: 20px; width: 28px; text-align: center; }
    .sprite-info { flex: 1; }
    .sprite-name { font-weight: 600; font-size: 13px; }
    .sprite-id { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .sprite-actions { display: flex; gap: 6px; }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.12s;
    }
    .btn:hover { opacity: 0.82; }
    .btn-remove {
      background: #443040;
      color: #f4a7b9;
    }
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 32px 20px;
      font-size: 12px;
      line-height: 1.7;
    }
    .empty-state .big { font-size: 32px; margin-bottom: 8px; }
    footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .add-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-add {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn-add:hover { border-color: var(--accent); background: #333355; }
    .btn-add .em { font-size: 16px; }
    .main { display: flex; flex-direction: column; height: 100%; }
  </style>
</head>
<body>
  <div class="main">
    <header>
      <h1>Sprite Manager</h1>
      <span>🐾</span>
    </header>
    <div class="sprite-list" id="sprite-list"></div>
    <footer>
      <div class="add-grid" id="add-grid"></div>
    </footer>
  </div>
  <script type="module" src="./manager.js"></script>
</body>
</html>
